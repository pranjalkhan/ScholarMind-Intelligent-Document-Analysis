services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knowflow
      POSTGRES_PASSWORD: knowflow_password
      POSTGRES_DB: knowflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://knowflow:knowflow_password@postgres:5432/knowflow
      QDRANT_URL: http://qdrant:6333
      SECRET_KEY: change-me-in-production
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      USE_LOCAL_TRANSFORMERS: "false"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres
      - qdrant

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
